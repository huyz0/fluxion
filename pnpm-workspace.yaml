packages:
  - packages/*
  - apps/*
  - packs/*

# Supply chain (NFR-SEC-005): only install versions published at least a day ago.
minimumReleaseAge: 1440

autoInstallPeers: false
strictPeerDependencies: false
saveExact: true

# Install scripts stay off (NFR-SEC-005). esbuild (via Storybook) works without its postinstall: the
# platform binary arrives as an optional dependency.
allowBuilds:
  esbuild: false

# dependency-cruiser parses TypeScript through the compiler API, which TS 7 does not ship yet; it
# gets TS 6 here: the only TS 6 version string, which the typescript6 catalog below reuses (YAML anchor;
# pnpm allows no catalog: specifier in packageExtensions). ADR-0011. The repo's tsc stays on TS 7.
packageExtensions:
  dependency-cruiser:
    dependencies:
      typescript: &typescript6 npm:typescript@6.0.3

# One version per shared dependency; packages refer to these with "catalog:".
# Versions verified on npm 2026-09-26 (docs/standards/tech-stack.md). Each row adds the pins it
# installs, checked against minimumReleaseAge; knip fails on unused catalog entries.
catalog:
  typescript: 7.0.2
  alien-signals: 3.2.1 # document reactivity (ADR-0002), M3.10
  turbo: 2.11.4
  "@types/node": 22.20.4 # types for the engines.node floor (22.x)
  tsdown: 0.23.0
  publint: 0.3.24
  "@arethetypeswrong/cli": 0.18.5
  knip: 6.38.0
  size-limit: 14.0.1
  "@size-limit/preset-small-lib": 14.0.1
  "@biomejs/biome": 2.5.14
  dependency-cruiser: 18.4.0
  vitest: 5.0.2
  "@vitest/browser-playwright": 5.0.2
  "@vitest/coverage-v8": 5.0.2
  playwright: 1.63.0
  fast-check: 4.10.2
  "@huyz0/tzap": 0.1.1 # mutation testing (ADR-0146), M4.3
  vite: 8.3.1
  "@microsoft/api-extractor": 7.59.2
  typedoc: 0.28.20
  "@playwright/test": 1.63.0
  "@axe-core/playwright": 4.13.0
  axe-core: 4.13.0
  storybook: 10.6.0
  "@storybook/react-vite": 10.6.0
  "@storybook/addon-a11y": 10.6.0
  astro: 7.3.5
  "@astrojs/starlight": 0.42.4
  "@astrojs/markdown-remark": 7.3.1
  starlight-llms-txt: 0.12.0
  starlight-typedoc: 0.23.1
  typedoc-plugin-markdown: 4.13.1
  "@changesets/cli": 3.0.3
  "@vitejs/plugin-react": 6.1.1
  react: 19.3.0
  react-dom: 19.3.0
  prosemirror-model: 1.25.12 # rich-text editing, editor only (ADR-0064), M7.12
  prosemirror-state: 1.4.4 # rich-text editing, editor only (ADR-0064), M7.12
  prosemirror-view: 1.42.6 # rich-text editing, editor only (ADR-0064), M7.12
  prosemirror-commands: 1.7.2 # rich-text editing, editor only (ADR-0064), M7.12
  prosemirror-keymap: 1.2.3 # rich-text editing, editor only (ADR-0064), M7.12
  prosemirror-history: 1.5.1 # rich-text editing, editor only (ADR-0064), M7.12
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  zod: 4.6.5 # schema runtime (tech-stack.md "Schema"), MIT; bundled by the player through @fluxion/schema
  rbush: 4.0.1 # dynamic spatial index (ADR-0141), MIT; bundled by the player through @fluxion/geometry
  "@types/rbush": 4.0.0 # rbush ships no types; MIT, dev only
  flatbush: 4.6.2 # static spatial index (ADR-0141), ISC; bundled by the player through @fluxion/geometry

# TS 6 for tools that need the compiler API (ADR-0011): apps/docs installs it as its own
# `typescript` via "catalog:typescript6", so TypeDoc resolves its peer to TS 6, not the root TS 7.
catalogs:
  typescript6:
    typescript: *typescript6

# Planned pins: none left for M1 (every row installed its own).
#   @storybook/addon-vitest: 10.6.0 is not installed (supports Vitest <= 4; ADR-0139)
