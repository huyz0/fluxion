packages:
  - packages/*
  - apps/*
  - packs/*

# Supply chain (NFR-SEC-005): only install versions published at least a day ago.
minimumReleaseAge: 1440

autoInstallPeers: false
strictPeerDependencies: false
saveExact: true

# Install scripts stay off (NFR-SEC-005). esbuild (via Storybook) works without its postinstall: the
# platform binary arrives as an optional dependency.
allowBuilds:
  esbuild: false

# dependency-cruiser parses TypeScript through the compiler API, which TS 7 does not ship yet; it
# gets TS 6 here: the only TS 6 version string, which the typescript6 catalog below reuses (YAML anchor;
# pnpm allows no catalog: specifier in packageExtensions). ADR-0011. The repo's tsc stays on TS 7.
# GHSA-68fv-2mgg-jv7q (CVSS 8.7): source-map-js 1.2.1 arrives through astro's svgo (docs build) and postcss; 1.2.2 is the fix (M11.73).
overrides:
  # M18.67 dependency qualification: GHSA-ch52-4w7c-c8xp and GHSA-rj75-hqrm-r3gf in the existing docs toolchain.
  "http-cache-semantics@<4.3.0": 4.3.0
  "postcss-selector-parser@<7.1.6": 7.1.6
  source-map-js: 1.2.2
  # GHSA-c475-qrg2-pj4r, GHSA-pxg6-pf52-xh8x, GHSA-52f5-9888-hmc6, GHSA-ph9p-34f9-6g65, GHSA-w5hq-g745-h8pq, GHSA-7c78-jf6q-g5cm: all reached only through @lhci/cli (M11.54, M11.77)
  basic-ftp: 6.2.1
  cookie@<0.7.0: 0.7.2
  tmp@<0.2.7: 0.2.7
  uuid@<11.1.1: 11.1.1
  # GHSA-wq5f-xc86-pv6w (sharp, via astro: the docs build) and GHSA-pqg4-j6r4-53mv (shell-quote, via @changesets/cli and launch-editor): M11.84
  sharp@<0.35.5: 0.35.5
  shell-quote@<1.11.0: 1.11.0
  # GHSA-gfr2-rv44-r23c, GHSA-vfgh-jcmw-g37q (markdown-it, docs and API tooling) and GHSA-587h-7wmj-h5pm, GHSA-698v-4r3x-3vcv, GHSA-r825-w8mm-5pxw (launch-editor, via vite): M17.28
  markdown-it@<14.3.3: 14.3.3
  launch-editor@<2.14.2: 2.14.2
  # GHSA-rxp7-6hxx-x8q5 (ip-address, via express-rate-limit in @modelcontextprotocol/sdk, the MCP server; and socks via @lhci/cli): M17.35
  ip-address@<10.7.4: 10.7.4
  # M17.45: security advisories confirmed by the 2026-10-24 local audit; retain all existing scanner policies.
  "zod@>=4 <4.6.6": 4.6.6
  "body-parser@>=1 <1.20.9": 1.20.9
  "body-parser@>=2 <2.4.0": 2.4.0
  "undici@>=8 <8.12.2": 8.12.2
  "fast-uri@>=3 <3.1.9": 3.1.9
  # Lighthouse's old Puppeteer pulls Zod 3. Use a Puppeteer that declares Zod 4 through Chromium BiDi.
  lighthouse>puppeteer-core: 25.16.0

packageExtensions:
  dependency-cruiser:
    dependencies:
      typescript: &typescript6 npm:typescript@6.0.3

# One version per shared dependency; packages refer to these with "catalog:".
# Versions verified on npm 2026-09-26 (docs/standards/tech-stack.md). Each row adds the pins it
# installs, checked against minimumReleaseAge; knip fails on unused catalog entries.
catalog:
  typescript: 7.0.2
  tsrs: 0.18.0-ts7.1.0-dev.20260929 # opt-in Rust compiler; TS7 remains authoritative (ADR-0179)
  alien-signals: 3.2.1 # document reactivity (ADR-0002), M3.10
  turbo: 2.11.4
  "@types/node": 22.20.4 # types for the engines.node floor (22.x)
  tsdown: 0.23.0
  publint: 0.3.24
  "@arethetypeswrong/cli": 0.18.5
  knip: 6.38.0
  size-limit: 14.0.1
  "@size-limit/preset-small-lib": 14.0.1
  "@biomejs/biome": 2.5.14
  dependency-cruiser: 18.4.0
  vitest: 5.0.5
  "@vitest/browser-playwright": 5.0.5
  "@vitest/coverage-v8": 5.0.5
  playwright: 1.63.0
  fast-check: 4.10.2
  "@huyz0/tzap": 0.1.1 # mutation testing (ADR-0146), M4.3
  vite: 8.3.5
  "@microsoft/api-extractor": 7.59.2
  typedoc: 0.28.20
  "@playwright/test": 1.63.0
  "@axe-core/playwright": 4.13.0
  axe-core: 4.13.0
  storybook: 10.6.3
  "@storybook/react-vite": 10.6.3
  "@storybook/addon-a11y": 10.6.3
  astro: 7.3.5
  "@astrojs/starlight": 0.42.4
  "@astrojs/markdown-remark": 7.3.1
  starlight-llms-txt: 0.12.0
  starlight-typedoc: 0.23.1
  typedoc-plugin-markdown: 4.13.1
  "@changesets/cli": 3.0.3
  "@vitejs/plugin-react": 6.1.1
  react: 19.3.0
  react-dom: 19.3.0
  prosemirror-model: 1.25.12 # rich-text editing, editor only (ADR-0064), M7.12
  prosemirror-state: 1.4.4 # rich-text editing, editor only (ADR-0064), M7.12
  prosemirror-view: 1.42.6 # rich-text editing, editor only (ADR-0064), M7.12
  prosemirror-commands: 1.7.2 # rich-text editing, editor only (ADR-0064), M7.12
  prosemirror-keymap: 1.2.3 # rich-text editing, editor only (ADR-0064), M7.12
  prosemirror-history: 1.5.1 # rich-text editing, editor only (ADR-0064), M7.12
  prosemirror-inputrules: 1.5.1 # markdown shortcuts, editor only (ADR-0064), M7.13
  prosemirror-schema-list: 1.5.1 # list keys, editor only (ADR-0064), M7.13
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  yaml: 2.9.1 # FluxScript parsing with source ranges (tech-stack.md "DSL parsing", ADR-0030), ISC, M12.8
  "@dagrejs/dagre": 3.1.1 # `layered` layout (ADR-0034), MIT, M13.8
  mdast-util-from-markdown: 2.0.3 # Markdown outline import (ADR-0040), MIT; @fluxion/dsl only, M15.17
  zod: 4.6.6 # schema runtime (tech-stack.md "Schema"), MIT; bundled by the player through @fluxion/schema
  elkjs: 0.12.0 # optional ELK layouts (ADR-0045), EPL-2.0 OR GPL-3.0-or-later used under EPL-2.0; only in packs/layouts-elk, M17.20
  "@modelcontextprotocol/sdk": 1.32.1 # MCP server and client (ADR-0038), MIT; @fluxion/mcp only
  rbush: 4.0.1 # dynamic spatial index (ADR-0141), MIT; bundled by the player through @fluxion/geometry
  "@types/rbush": 4.0.0 # rbush ships no types; MIT, dev only
  flatbush: 4.6.2 # static spatial index (ADR-0141), ISC; bundled by the player through @fluxion/geometry
  "@lingui/core": 6.9.0 # i18n runtime for the editor and studio (ADR-0023), MIT; the player takes none
  "@lingui/react": 6.9.0 # I18nProvider and Trans for the editor and studio (ADR-0023), MIT
  "@lingui/native-tools": 0.1.5 # macro transform and message extraction without Babel (ADR-0023), MIT, dev only
  "@lingui/conf": 6.9.0 # peer of native-tools (ADR-0023), MIT, dev only
  "@lingui/message-utils": 6.9.0 # compiles ICU catalogs to function catalogs (ADR-0023), MIT, dev only
  "@lhci/cli": 0.14.0 # Lighthouse CI for the editor time-to-interactive job (M11.54, closes ADR-0156), Apache-2.0, dev only
  oxc-parser: 0.151.0 # JSX parsing for scripts/gates/check-i18n.mjs (ADR-0159; TS 7 ships no compiler API), MIT, dev only
  "@codemirror/state": 6.7.6 # source view, editor only, lazy chunk (ADR-0032), MIT, M12.20
  "@codemirror/view": 6.43.14 # source view (ADR-0032), MIT, M12.20
  "@codemirror/language": 6.13.1 # source view: LanguageSupport, syntax tree (ADR-0032), MIT, M12.20
  "@codemirror/autocomplete": 6.20.3 # source view: completion of shape ids, tokens and slugs (ADR-0032), MIT, M12.21
  "@codemirror/lang-yaml": 6.1.3 # source view: the Lezer YAML grammar under the FluxScript layer (ADR-0032), MIT, M12.20
  "@codemirror/commands": 6.11.1 # source view: text history and its keys (ADR-0032), MIT, M12.59
  shiki: 4.4.3 # TextMate tokenizer for the grammar snapshot test (M12.20), MIT, dev only

# TS 6 for tools that need the compiler API (ADR-0011): apps/docs installs it as its own
# `typescript` via "catalog:typescript6", so TypeDoc resolves its peer to TS 6, not the root TS 7.
catalogs:
  typescript6:
    typescript: *typescript6

# Planned pins: none left for M1 (every row installed its own).
#   @storybook/addon-vitest: 10.6.0 is not installed (supports Vitest <= 4; ADR-0139)
