# Harness gates on every push and PR (docs/standards/ci-cd.md). The same scripts the local hooks
# run, so hook and CI cannot drift. The full ladder (`pnpm verify` = precommit.mjs --all) runs once
# per OS in ci.yml's verify matrix (M2.22); this workflow keeps the ubuntu-only gates: workflow lint
# with Docker, and every commit's message-level gates (task id, Removes-test, Threshold-change) via
# check-commits.mjs. check-reviewed is local-only: per-commit verdicts are bound to local staged
# bytes (.harness/review is gitignored). Both scripts use only Node built-ins: nothing is installed.
name: gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Only PR runs share a group (and cancel). Each push gets its own group keyed by its SHA: GitHub
# replaces a *pending* run in a shared group even without cancel-in-progress, and a skipped push
# run would leave its commits unchecked because the next push's range starts at its own `before`.
concurrency:
  group: gates-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # the CI rung budget (ci-cd.md section 1)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # the ladder's workflows step SKIPs without Docker (windows/macos runners); here actionlint and
      # zizmor must really run (M1.19, M1 cp1 F3)
      - name: workflow lint (Docker required)
        run: node scripts/gates/check-workflows.mjs --require-docker
      # an empty or all-zero base (a branch's first push) falls back to the pre-harness baseline inside
      # check-commits.mjs
      - name: per-commit message gates
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/gates/check-commits.mjs --range "$BASE..$HEAD_SHA"
