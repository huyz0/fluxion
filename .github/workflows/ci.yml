# Product CI (docs/standards/ci-cd.md section 3). `ci-ok` is the single required status check: it
# needs every job and passes only when all of them succeeded (scripts/ci/all-green.mjs). Steps call
# repo scripts; no long inline scripts (NFR-PORT-005). Actions and the Playwright image are pinned by
# digest (NFR-SEC-005); Renovate tracks them (renovate.json).
name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

# PR runs share a group and cancel; each push has its own group so no push run is replaced (as gates.yml)
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: chromium for the Vitest browser project (T1)
        run: pnpm exec playwright install --with-deps chromium
      - name: git identity for sandbox tests
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
      # the only three-OS run of the full ladder (M2.22); gates.yml keeps the ubuntu-only harness gates
      - run: pnpm verify
      # only after a ladder failure, to name every failing test in full (the ladder shows a tail, M1.39);
      # a green ladder already ran the suite, and a second run pushed windows past its timeout (M1.42)
      - name: harness tests
        if: failure()
        run: node --test "tests/harness/*.test.mjs"

  # NFR-DX-001: a fresh clone set up from nothing (pnpm i --frozen-lockfile, pnpm run setup, pnpm verify
  # into an empty pnpm store and browser cache) within COLD_SETUP_MAX_MS; check-budget --cold measures
  # it the way --record does locally and fails above the threshold
  cold-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # no dependency cache: the measured install must download everything
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: git identity for sandbox tests
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
      - name: cold setup within COLD_SETUP_MAX_MS
        run: node scripts/gates/check-budget.mjs --cold

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # the R0 demo rendered by the built CLI: a static page anyone can open from the run (M4.22, FR-CLI-001)
      - run: node packages/cli/dist/bin.js render examples/r0-static.flux.json -o r0-static.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r0-static-demo
          path: r0-static.html
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            packages/*/dist
            packs/*/dist
            apps/*/dist
          if-no-files-found: error
          retention-days: 3

  e2e:
    name: e2e (${{ matrix.browser }} ${{ matrix.shard }}/4)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # browsers come from the pinned image instead of being downloaded (ci-cd.md section 4)
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    env:
      HOME: /root # Firefox refuses a HOME owned by another user inside the container
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3, 4]
        include:
          # each desktop engine also runs its mobile preset; firefox has none (--project is a filter, so
          # naming it twice runs it once)
          - browser: chromium
            mobile: mobile-chrome
          - browser: firefox
            mobile: firefox
          - browser: webkit
            mobile: mobile-safari
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
      # a shard can be empty while the suite is small; e2e-report fails when no test ran at all
      - run: pnpm test:e2e --project="$BROWSER" --project="$MOBILE" --shard="$SHARD/4" --reporter=blob --pass-with-no-tests
        env:
          BROWSER: ${{ matrix.browser }}
          MOBILE: ${{ matrix.mobile }}
          SHARD: ${{ matrix.shard }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blob-${{ matrix.browser }}-${{ matrix.shard }}
          path: blob-report
          retention-days: 3

  e2e-report:
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: blob-*
          path: all-blob-reports
          merge-multiple: true
      - run: pnpm exec playwright merge-reports --reporter=json,html all-blob-reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: merged.json
      - run: node scripts/ci/flake-report.mjs merged.json
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-html-report
          path: playwright-report
          retention-days: 14

  visual:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
      # every @visual spec on the desktop engines; selecting none fails the job (M5.3)
      - run: pnpm test:visual
      - if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-diffs
          path: test-results
          retention-days: 14

  a11y:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
      - run: pnpm test:a11y

  size:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
      - run: pnpm exec size-limit

  api:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changeset status compares with the base branch
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
      # TypeDoc reads project references' .tsbuild declarations, which the dist artifact lacks (M3.5)
      - run: pnpm run typecheck
      - run: node scripts/gates/check-api.mjs
      - name: changeset present for changed packages
        if: github.event_name == 'pull_request'
        run: pnpm exec changeset status --since="origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}

  license:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/gates/check-licenses.mjs

  # CodeQL, OSV-Scanner, dependency review, zizmor (ci-cd.md section 3: results feed ci-ok)
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/security.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the newer $/ form

  # T5 evals on recorded responses start in M14; until then the job says so instead of passing silently
  eval-recorded:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "eval-recorded — SKIP, no evals until M14"

  ci-ok:
    if: always()
    needs: [verify, cold-setup, build, e2e, e2e-report, visual, a11y, size, api, license, security, eval-recorded]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - run: node scripts/ci/all-green.mjs
        env:
          NEEDS: ${{ toJSON(needs) }}
