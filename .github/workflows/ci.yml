# Product CI (docs/standards/ci-cd.md section 3). `ci-ok` is the single required status check: it
# needs every job and passes only when all of them succeeded (scripts/ci/all-green.mjs). Steps call
# repo scripts; no long inline scripts (NFR-PORT-005). Actions and the Playwright image are pinned by
# digest (NFR-SEC-005); Renovate tracks them (renovate.json).
name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

# PR runs share a group and cancel; each push has its own group so no push run is replaced (as gates.yml)
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (${{ matrix.os }})
    # actions: read lets the headroom step read the previous run's durations (M18.224)
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # ADR-0197: Windows verification gets 25 of a 45 minute envelope; ADR-0209: macOS 20 of 40; ubuntu keeps 15 of 35 (ADR-0191)
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || matrix.os == 'macos-latest' && 40 || 35 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # M18.182: the locked Playwright release's browsers restored, not downloaded; keyed on its browsers.json, so a miss only costs time
      - name: playwright browsers cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/ms-playwright' || runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/playwright-core@*/node_modules/playwright-core/browsers.json') }}
      - name: chromium for the Vitest browser project (T1)
        timeout-minutes: 15
        run: pnpm exec playwright install --with-deps chromium
      - name: git identity for sandbox tests
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
      # the only three-OS run of the full ladder (M2.22); gates.yml keeps the ubuntu-only harness gates
      # ADR-0214 (M18.256): on Windows the harness tests run in harness-windows, beside this job, not inside its 25 minutes
      - run: ${{ matrix.os == 'windows-latest' && 'node scripts/gates/precommit.mjs --all --skip harness-tests' || 'pnpm verify' }}
        timeout-minutes: ${{ matrix.os == 'windows-latest' && 25 || matrix.os == 'macos-latest' && 20 || 15 }}
        # M18.222: each unit test's duration and timeout on this OS, for scripts/harness/test-headroom.mjs
        env:
          FLUXION_TEST_DURATIONS: .harness/tmp/test-durations/${{ matrix.os }}.json
      # a test over half its timeout is a warning on its first run and fails the job when the run before on this OS had it over
      # too (M18.224, cp33 F1): one slow runner warns, a test that keeps no headroom reddens main before a slower runner times it out
      - name: test headroom
        timeout-minutes: 3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OS: ${{ matrix.os }}
        run: |
          f=".harness/tmp/test-durations/$OS.json"
          [ -f "$f" ] || { echo "::error::no test durations recorded on $OS"; exit 1; }
          # the newest main run, not this one, completed or in progress, whose verify on this OS finished (a cancelled one wrote no report; M18.232, M18.238)
          prev_run=$(node scripts/harness/test-headroom.mjs --pick-previous --os "$OS" --exclude "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || true)
          previous=()
          if [ -n "$prev_run" ] && gh run download "$prev_run" -R "$GITHUB_REPOSITORY" -n "test-durations-$OS" -D "$RUNNER_TEMP/previous-durations"; then
            previous=(--previous "$RUNNER_TEMP/previous-durations/$OS.json")
          else
            echo "::warning::no durations from the previous run on $OS; this run only warns"
            previous=(--warn-only)
          fi
          # the bounded-time cases whose readings rows record by run id even under the share (M18.247, M18.248)
          show=(--show 'packages/format/src/drawio-import.test.ts > ' --show 'deterministic across fresh engines')
          node scripts/harness/test-headroom.mjs --file "$f" "${previous[@]}" "${show[@]}" | sed -e 's/^test-headroom: \(.* ms of .*\)$/::warning::\1/' -e 's/^test-headroom: \(over in two consecutive runs: .*\)$/::error::\1/'
      - name: test durations
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-durations-${{ matrix.os }}
          path: .harness/tmp/test-durations
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      # The ladder persists live streams and completed failures; do not rerun failed checks.
      - name: verification failure reports
        if: always() && (failure() || cancelled())
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-failures-${{ matrix.os }}
          path: .harness/tmp/verify-logs
          include-hidden-files: true
          retention-days: 14

  # ADR-0214 (M18.256): the Windows ladder's harness-tests leg, split off verify (windows-latest) so the two longest legs
  # (Vitest and the harness suite, 1150-1360 s and 1050-1210 s side by side on 4 vCPUs) no longer share one runner and one
  # 25-minute step. The same precommit ladder with --only keeps its ordered prefix (typecheck, build), so the leg reads dist/
  # as in verify; verify (windows-latest) runs every other leg with --skip harness-tests. Same step and job bounds as verify.
  harness-windows:
    name: harness tests (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # M18.182: the locked Playwright release's browsers restored, not downloaded; keyed on its browsers.json, so a miss only costs time
      - name: playwright browsers cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/ms-playwright' || runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/playwright-core@*/node_modules/playwright-core/browsers.json') }}
      - name: chromium for the font-engine harness test
        timeout-minutes: 15
        run: pnpm exec playwright install --with-deps chromium
      - name: git identity for sandbox tests
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
      - run: node scripts/gates/precommit.mjs --all --only harness-tests
        timeout-minutes: 25
      - name: verification failure reports
        if: always() && (failure() || cancelled())
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-failures-harness-windows-latest
          path: .harness/tmp/verify-logs
          include-hidden-files: true
          retention-days: 14

  # NFR-DX-001: a fresh clone set up from nothing (pnpm i --frozen-lockfile, pnpm run setup, pnpm verify without coverage
  # into an empty pnpm store and browser cache) within COLD_SETUP_MAX_MS; the verify jobs gate coverage (ADR-0216); check-budget --cold measures
  # it the way --record does locally and fails above the threshold
  # while M18.157 is open a run over the limit is a warning (check-budget --cold exits 0 and annotates it);
  # a failure by status fails the run (M18.159, Huy's call 2026-10-28; no limit change)
  cold-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # no dependency cache: the measured install must download everything
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: git identity for sandbox tests
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
      - name: cold setup within COLD_SETUP_MAX_MS
        run: node scripts/gates/check-budget.mjs --cold

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # the R0 demo rendered by the built CLI: a static page anyone can open from the run (M4.22, FR-CLI-001)
      - run: node packages/cli/dist/bin.js render examples/r0-static.flux.json -o r0-static.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r0-static-demo
          path: r0-static.html
          if-no-files-found: error
          retention-days: 14
      # the M5 shapes gallery (every basic shape, route type and marker) rendered the same way (M5.25, FR-SHP-002)
      - run: node packages/cli/dist/bin.js render examples/shapes-gallery.flux.json -o shapes-gallery.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shapes-gallery-demo
          path: shapes-gallery.html
          if-no-files-found: error
          retention-days: 14
      # the R2 demo deck compiled from FluxScript and rendered by the built CLI (M15.23, FR-MCP-001)
      - run: node packages/cli/dist/bin.js compile examples/r2-ai-deck.flux.yaml -o r2-ai-deck.flux.json
      - run: node packages/cli/dist/bin.js render r2-ai-deck.flux.json -o r2-ai-deck.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r2-ai-deck-demo
          path: r2-ai-deck.html
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            packages/*/dist
            packs/*/dist
            apps/*/dist
          if-no-files-found: error
          retention-days: 3

  # every chromium spec runs here, axe included (expectAccessible): this is the a11y gate (ADR-0207, M18.184)
  e2e:
    name: e2e (${{ matrix.browser }} ${{ matrix.shard }}/4)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # browsers come from the pinned image instead of being downloaded (ci-cd.md section 4)
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    env:
      HOME: /root # Firefox refuses a HOME owned by another user inside the container
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3, 4]
        include:
          # each desktop engine also runs its mobile preset; firefox has none (--project is a filter, so
          # naming it twice runs it once)
          - browser: chromium
            mobile: mobile-chrome
          - browser: firefox
            mobile: firefox
          - browser: webkit
            mobile: mobile-safari
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
      # a shard can be empty while the suite is small; e2e-report fails when no test ran at all
      - run: pnpm test:e2e --project="$BROWSER" --project="$MOBILE" --shard="$SHARD/4" --reporter=blob --pass-with-no-tests
        env:
          BROWSER: ${{ matrix.browser }}
          MOBILE: ${{ matrix.mobile }}
          SHARD: ${{ matrix.shard }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blob-${{ matrix.browser }}-${{ matrix.shard }}
          path: blob-report
          retention-days: 3

  e2e-report:
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: blob-*
          path: all-blob-reports
          merge-multiple: true
      - run: pnpm exec playwright merge-reports --reporter=json,html all-blob-reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: merged.json
      - run: node scripts/ci/flake-report.mjs merged.json
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-html-report
          path: |
            playwright-report
            merged.json
          retention-days: 14

  visual:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
      # every @visual spec on the desktop engines; selecting none fails the job (M5.3)
      - run: pnpm test:visual
      - if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-diffs
          path: test-results
          retention-days: 14

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fluxion/studio run build
      # the editor's time to interactive on Lighthouse's desktop preset against EDITOR_TTI_MS (NFR-SIZE-002); the browser is the one the Playwright image carries
      - run: pnpm exec node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())" > "$RUNNER_TEMP/chrome-path"
      # lhci reads a JSON config: lighthouserc.mjs (which reads EDITOR_TTI_MS) is written out as one
      - run: node --input-type=module -e "import c from './lighthouserc.mjs'; import { writeFileSync } from 'node:fs'; writeFileSync(process.env.RUNNER_TEMP + '/lhci.json', JSON.stringify(c));"
      # @lhci/cli is a locked devDependency (M11.54, which closed ADR-0156's npx exception)
      - run: CHROME_PATH="$(cat "$RUNNER_TEMP/chrome-path")" pnpm exec lhci autorun --config="$RUNNER_TEMP/lhci.json"

  size:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
      - run: node scripts/gates/check-bundle-size.mjs
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-size-measurements
          path: |
            .harness/artifacts/bundle-size.json
            .harness/artifacts/size-limit.stdout.log
            .harness/artifacts/size-limit.stderr.log
          include-hidden-files: true
          if-no-files-found: error

  api:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changeset status compares with the base branch
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
      # TypeDoc reads project references' .tsbuild declarations, which the dist artifact lacks (M3.5)
      - run: pnpm run typecheck
      - run: node scripts/gates/check-api.mjs
      - name: changeset present for changed packages
        if: github.event_name == 'pull_request'
        run: pnpm exec changeset status --since="origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}

  license:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/gates/check-licenses.mjs

  # CodeQL, OSV-Scanner, dependency review, zizmor (ci-cd.md section 3: results feed ci-ok)
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/security.yml # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the newer $/ form

  # T5 evals on recorded responses (ADR-0039): replays eval/recordings through the real pipeline and uploads the scorecard
  eval-recorded:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm eval --recorded
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: eval-scorecard
          path: eval/out/
          if-no-files-found: error

  # NFR-PORT-004: the CLI and the MCP server run on Node 22 and 24 on Linux, Windows and macOS. They spawn the built bins, so this job builds first.
  cli-mcp:
    name: cli-mcp (${{ matrix.os }}, node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # M18.182: the locked Playwright release's browsers restored, not downloaded; keyed on its browsers.json, so a miss only costs time
      - name: playwright browsers cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/ms-playwright' || runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/playwright-core@*/node_modules/playwright-core/browsers.json') }}
      - name: chromium for the PNG render tests
        run: pnpm exec playwright install --with-deps chromium
      - name: e2e of @fluxion/cli and @fluxion/mcp
        run: pnpm exec vitest run --project node packages/cli/src/e2e packages/mcp/src/e2e

  ci-ok:
    if: always()
    needs: [verify, harness-windows, cold-setup, build, cli-mcp, e2e, e2e-report, visual, lighthouse, size, api, license, security, eval-recorded]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - run: node scripts/ci/all-green.mjs
        env:
          NEEDS: ${{ toJSON(needs) }}
