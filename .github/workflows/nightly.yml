# Nightly deep checks (docs/standards/ci-cd.md section 3). Failures never block PRs: the report job
# opens or updates one "Nightly failure" issue that the next milestone plan must dispose of.
# Jobs whose tooling lands later print SKIP naming the milestone that brings it.
name: nightly

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # tzap over every pure package, each held to its floor in .harness/baselines/mutation.json (ADR-0146)
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - run: pnpm mutate --check --out-dir reports/tzap
      - if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: reports/tzap
          retention-days: 14

  properties:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FC_RUNS: '10000' # fast-check runs per property (tools/vitest/fast-check.setup.ts)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - run: pnpm test

  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "perf — SKIP, benches and perf-baseline.json land in M13"

  eval-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "eval-live — SKIP, live evals land in M16"

  visual-xos:
    name: visual-xos (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # NFR-PORT-006: the visual suite on every OS, Chromium only
      - run: pnpm exec playwright test --grep @visual --project=chromium

  # NFR-PORT-001: the whole e2e suite on the Playwright release before the pinned one (scripts/ci/previous-playwright.mjs sets the catalog's pins for this run only)
  previous-playwright:
    name: previous-playwright (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            mobile: mobile-chrome
          - browser: firefox
            mobile: firefox
          - browser: webkit
            mobile: mobile-safari
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: node scripts/ci/previous-playwright.mjs
      # the catalog now names the previous release, so the lockfile is re-resolved for this run (never committed)
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm run build
      - run: pnpm test:e2e --project="$BROWSER" --project="$MOBILE"
        env:
          BROWSER: ${{ matrix.browser }}
          MOBILE: ${{ matrix.mobile }}

  report:
    needs: [mutation, properties, perf, eval-live, visual-xos, previous-playwright]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - run: node scripts/ci/nightly-issue.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NEEDS: ${{ toJSON(needs) }}
