# Nightly deep checks (docs/standards/ci-cd.md section 3). Failures never block PRs: the report job
# opens or updates one "Nightly failure" issue that the next milestone plan must dispose of.
# Jobs whose tooling lands later print SKIP naming the milestone that brings it.
name: nightly

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One nightly at a time (M18.10, cp44 F2): a run that outlives a day (41806720128 ran past 17 h)
# would otherwise run beside the next scheduled one, both sharing the account's runners. A fixed group with no
# cancel queues the next run behind the one in progress; GitHub keeps one pending run per group,
# so a later schedule or dispatch replaces a pending one, never a running one.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # ADR-0173: complete source partitions; all nine packages and unchanged floors aggregate below.
  mutation-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      matrix_2: ${{ steps.plan.outputs.matrix_2 }}
      chains: ${{ steps.plan.outputs.chains }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Create complete mutation plan
        id: plan
        run: node scripts/ci/mutation-nightly.mjs plan --out reports/mutation-plan.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-plan
          path: reports/mutation-plan.json
          if-no-files-found: error
          retention-days: 14

  # ADR-0198: GitHub expands one matrix to at most 256 jobs, so the partitions run as up to two chained matrices,
  # 8 concurrent jobs in all as before (4 each when both run); the plan splits them and aggregation needs every one.
  mutation-partitions:
    name: mutation (${{ matrix.id }})
    needs: mutation-plan
    strategy:
      fail-fast: false
      # 8 at a time when this matrix is the only one, else 4 here and 4 in mutation-partitions-2
      max-parallel: ${{ fromJSON(needs.mutation-plan.outputs.chains) > 1 && 4 || 8 }}
      matrix: ${{ fromJSON(needs.mutation-plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # M18.182: the locked Playwright release's browsers restored, not downloaded; keyed on its browsers.json, so a miss only costs time
      - name: playwright browsers cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/ms-playwright' || runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/playwright-core@*/node_modules/playwright-core/browsers.json') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-plan
          path: reports
      - name: Execute complete mutation partition
        env:
          MUTATION_PARTITION_ID: ${{ matrix.id }}
        run: node scripts/harness/mutate-shard.mjs --manifest reports/mutation-plan.json --partition "$MUTATION_PARTITION_ID" --out-dir reports/tzap
      - if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-partition-${{ matrix.id }}
          path: reports/tzap
          if-no-files-found: error
          retention-days: 14

  mutation-partitions-2:
    name: mutation (${{ matrix.id }})
    needs: mutation-plan
    if: ${{ fromJSON(needs.mutation-plan.outputs.chains) > 1 }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.mutation-plan.outputs.matrix_2) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # M18.182: the locked Playwright release's browsers restored, not downloaded; keyed on its browsers.json, so a miss only costs time
      - name: playwright browsers cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/ms-playwright' || runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/playwright-core@*/node_modules/playwright-core/browsers.json') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-plan
          path: reports
      - name: Execute complete mutation partition
        env:
          MUTATION_PARTITION_ID: ${{ matrix.id }}
        run: node scripts/harness/mutate-shard.mjs --manifest reports/mutation-plan.json --partition "$MUTATION_PARTITION_ID" --out-dir reports/tzap
      - if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-partition-${{ matrix.id }}
          path: reports/tzap
          if-no-files-found: error
          retention-days: 14

  mutation:
    needs: [mutation-plan, mutation-partitions, mutation-partitions-2]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-plan
          path: reports
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-partition-*
          path: reports/partitions
          merge-multiple: false
      - name: Validate complete mutation reports
        if: always()
        run: node scripts/ci/mutation-nightly.mjs aggregate --manifest reports/mutation-plan.json --reports reports/partitions --out reports/mutation-evidence.json
      - if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: |
            reports/mutation-plan.json
            reports/mutation-evidence.json
          if-no-files-found: error
          retention-days: 14

  properties:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FC_RUNS: '10000' # fast-check runs per property (tools/vitest/fast-check.setup.ts)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # M18.182: the locked Playwright release's browsers restored, not downloaded; keyed on its browsers.json, so a miss only costs time
      - name: playwright browsers cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/ms-playwright' || runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/playwright-core@*/node_modules/playwright-core/browsers.json') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - run: pnpm test

  # M18.291 (ADR-0218): the node tests in a shuffled file order, so an order dependence between files that share
  # a module registry, which isolation.mjs's markers miss, shows here before it reaches main; the seed replays it
  # one worker: with several, which files share a worker's registry depends on timing and core count, not on the seed alone
  node-shuffle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the node project holds the CLI e2e files that drive Chromium (svg-witness, artwork fonts, render-png), as in properties
      # M18.182: the locked Playwright release's browsers restored, not downloaded; keyed on its browsers.json, so a miss only costs time
      - name: playwright browsers cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/ms-playwright' || runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/playwright-core@*/node_modules/playwright-core/browsers.json') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - name: node tests in a shuffled file order
        run: |
          SEED=$(node -e "console.log(require('node:crypto').randomInt(1, 2 ** 31))")
          REPLAY="pnpm exec vitest run --project 'node*' --sequence.shuffle.files --maxWorkers=1 --sequence.seed=$SEED"
          echo "node-shuffle seed: $SEED"
          echo "node-shuffle seed: \`$SEED\` (replay: \`$REPLAY\`)" >> "$GITHUB_STEP_SUMMARY"
          pnpm exec vitest run --project 'node*' --sequence.shuffle.files --maxWorkers=1 --sequence.seed="$SEED" || {
            echo "::error title=node-shuffle::node tests failed in a shuffled file order, seed $SEED; replay: $REPLAY"
            exit 1
          }

  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # M18.182: the locked Playwright release's browsers restored, not downloaded; keyed on its browsers.json, so a miss only costs time
      - name: playwright browsers cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/ms-playwright' || runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/playwright-core@*/node_modules/playwright-core/browsers.json') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      # NFR-PERF-005: layered-100 and -500 (the layout worker path), tree, radial and mindmap at 500 and the full Lucide pack encode (M18.126)
      # against their thresholds (p99 ms) and, in calibration units beside a frozen workload, against perf-baseline.calibrated.json (ADR-0170)
      - run: node scripts/ci/perf-baseline.mjs
      # NFR-PERF-001: the hit-test-2000 bench (M6 final F4)
      - run: pnpm exec vitest bench --run --project "node (bench)" packages/editor/bench/hit-test-2000.bench.ts
      # the @perf Playwright specs: perf.drag-500, perf.layout-500 (no main-thread long task over 50 ms) and the rest, one worker
      # no retry: a spec that passes only on its second attempt fails the job (M16 final F12)
      - run: pnpm exec playwright test --project=perf --workers=1 --retries=0 --reporter=list,json,github
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/e2e.json
      # the specs' fps readings in the log, on a pass too: the report below is uploaded only on a failure (M18.131)
      - if: ${{ always() }}
        run: node scripts/ci/perf-readings.mjs test-results/e2e.json
      - if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-perf-results
          path: test-results
          retention-days: 14
          if-no-files-found: ignore

  eval-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "eval-live — SKIP, live evals land in M16"

  # ADR-0202: the ubuntu leg runs in the pinned image the baselines were made in (ci.yml's visual job) and must be green; Windows and macOS have no
  # per-OS baselines until M32 item 11, so their legs run, annotate and upload diffs, and their failure is expected rather than the nightly's
  visual-xos:
    name: visual-xos (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
            known-red: false
          - os: windows-latest
            image: ''
            known-red: true
          - os: macos-latest
            image: ''
            known-red: true
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    continue-on-error: ${{ matrix.known-red }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the pinned image ships its browsers; a bare runner installs Chromium
      # M18.182: the locked Playwright release's browsers restored, not downloaded; keyed on its browsers.json, so a miss only costs time
      - name: playwright browsers cache
        if: ${{ matrix.image == '' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/ms-playwright' || runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/playwright-core@*/node_modules/playwright-core/browsers.json') }}
      # M18.277, M18.282: on Windows, --with-deps only enables Server-Media-Foundation (~190 s); Chromium delay-loads it for media we never play.
      # M18.279 had put it back here after a Windows hang; none of the three was this: two build stalls (M18.281) and one Vitest stall with it installed (M18.283)
      - if: ${{ matrix.image == '' }}
        run: pnpm exec playwright install ${{ runner.os != 'Windows' && '--with-deps ' || '' }}chromium
      # the specs render through the built packages (the CLI), so the build comes first
      - run: pnpm run build
      # NFR-PORT-006: the visual suite on every OS, Chromium only
      - run: pnpm exec playwright test --grep "@visual" --project=chromium --retries=0 --reporter=list,json,github
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/e2e.json
      - if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-xos-${{ matrix.os }}-results
          path: test-results
          retention-days: 14
          if-no-files-found: ignore

  # NFR-PORT-001: the whole e2e suite on the Playwright release before the pinned one (scripts/ci/previous-playwright.mjs sets the catalog's pins for this run only)
  previous-playwright:
    name: previous-playwright (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            mobile: mobile-chrome
          - browser: firefox
            mobile: firefox
          - browser: webkit
            mobile: mobile-safari
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: node scripts/ci/previous-playwright.mjs
      # the catalog now names the previous release, so the lockfile is re-resolved for this run (never committed)
      - run: pnpm install --no-frozen-lockfile
      # M18.182: the locked Playwright release's browsers restored, not downloaded; keyed on its browsers.json, so a miss only costs time
      - name: playwright browsers cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/ms-playwright' || runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-${{ matrix.browser }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/playwright-core@*/node_modules/playwright-core/browsers.json') }}
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm run build
      # the visual baselines are the pinned image's pixels (ci.yml's visual job): they say nothing about another Playwright release
      - run: pnpm exec playwright test --grep-invert "@perf|@visual" --project="$BROWSER" --project="$MOBILE" --retries=0 --reporter=list,json,github
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/e2e.json
          BROWSER: ${{ matrix.browser }}
          MOBILE: ${{ matrix.mobile }}
      # Preserve JSON, traces and screenshots alongside the failure annotations.
      - if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: previous-playwright-${{ matrix.browser }}-results
          path: test-results
          retention-days: 14
      # what the engine does with Ctrl+C and Ctrl+V on a bare page, in the log (M11.59: the three clipboard specs fail on the older WebKit and the log holds only counts);
      # after the upload, bounded and never failing the job, so it cannot cost the traces
      - if: ${{ failure() && matrix.browser == 'webkit' }}
        continue-on-error: true
        timeout-minutes: 2
        run: node scripts/ci/clipboard-events-probe.mjs

  report:
    needs: [mutation, properties, node-shuffle, perf, eval-live, visual-xos, previous-playwright]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - run: node scripts/ci/nightly-issue.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NEEDS: ${{ toJSON(needs) }}
