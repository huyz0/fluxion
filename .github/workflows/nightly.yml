# Nightly deep checks (docs/standards/ci-cd.md section 3). Failures never block PRs: the report job
# opens or updates one "Nightly failure" issue that the next milestone plan must dispose of.
# Jobs whose tooling lands later print SKIP naming the milestone that brings it.
name: nightly

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "mutation — SKIP, Stryker floors land in M20"

  properties:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FC_RUNS: '10000' # fast-check runs per property (tools/vitest/fast-check.setup.ts)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - run: pnpm test

  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "perf — SKIP, benches and perf-baseline.json land in M13"

  eval-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "eval-live — SKIP, live evals land in M16"

  visual-xos:
    name: visual-xos (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # NFR-PORT-006: the visual suite on every OS, Chromium only
      - run: pnpm exec playwright test --grep @visual --project=chromium --pass-with-no-tests

  report:
    needs: [mutation, properties, perf, eval-live, visual-xos]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - run: node scripts/ci/nightly-issue.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NEEDS: ${{ toJSON(needs) }}
